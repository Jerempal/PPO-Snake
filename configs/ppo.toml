[architecture]
cnn_channels = [24, 32, 48]
strides = [1, 1, 1]
pool_size = 9
residual_blocks = true
normalization = "group"
groups = 4

[environment]
width = 20
height = 20
loop_max_state_visits = 3
grid_size = 20

[start_states]
enabled = false
standard_probability = 0.25
min_length_fraction = 0.25
max_length_fraction = 0.65
length_distribution = "normal"
mean_length_fraction = 0.45
std_length_fraction = 0.08

[rewards]
step = -0.001
food = 1.0
death = -2.0
win = 5.0
distance_beta = 0.3
loop = -0.25

[training]
seed = 42
total_timesteps = 500000
n_envs = 16
env_backend = "subprocess"
learning_rate = 0.001
learning_rate_schedule = "linear"
final_learning_rate = 0.0001
n_steps = 512
batch_size = 512
n_epochs = 15
gamma = 0.995
gae_lambda = 0.95
clip_range = 0.15
target_kl = 0.02
ent_coef = 0.01
hidden_size = 128
hidden_layers = 2
vf_coef = 0.5
device = "auto"

[evaluation]
frequency = 75000
episodes = 30
n_envs = 8
deterministic = true
patience = 80
min_score_improvement = 0.0

[checkpoint]
frequency = 100000
